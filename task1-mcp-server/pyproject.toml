[project]
name = "customer-ops-mcp"
version = "0.1.0"
description = "Stdio MCP server with strict validation for customer lookup and refunds"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=2,<3",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
